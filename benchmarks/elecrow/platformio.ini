[platformio]
default_envs = elecrow_s3_n4r8_probe

[env:elecrow_s3_n4r8_probe]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
# Explicit source isolation: each probe owns setup()/loop().
build_src_filter = -<*> +<main.cpp>
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
upload_speed = 460800

[env:elecrow_s3_scale_probe]
extends = env:elecrow_s3_n4r8_probe
build_flags =
    ${env:elecrow_s3_n4r8_probe.build_flags}
    -DPG_DISPOSABLE_SCALE_PROBE
    -DARDUINO_LOOP_STACK_SIZE=32768
    -mtext-section-literals

[env:elecrow_s3_4096_probe]
extends = env:elecrow_s3_n4r8_probe
build_flags =
    ${env:elecrow_s3_n4r8_probe.build_flags}
    -DPG_DISPOSABLE_SCALE_PROBE
    -DPG_DISPOSABLE_4096_PROBE
    -DARDUINO_LOOP_STACK_SIZE=65536
    -mtext-section-literals

[env:elecrow_s3_wildlife_probe]
extends = env:elecrow_s3_4096_probe
build_flags =
    ${env:elecrow_s3_4096_probe.build_flags}
    -DPG_WILDLIFE_PROBE

[env:elecrow_s3_discovery_probe]
extends = env:elecrow_s3_n4r8_probe
build_flags =
    ${env:elecrow_s3_n4r8_probe.build_flags}
    -DPG_DISCOVERY_PROBE
    -DARDUINO_LOOP_STACK_SIZE=32768

[env:elecrow_s3_family_probe]
extends = env:elecrow_s3_discovery_probe
build_flags =
    ${env:elecrow_s3_discovery_probe.build_flags}
    -DPG_FAMILY_PROBE

[env:elecrow_s3_construction_probe]
extends = env:elecrow_s3_n4r8_probe
build_flags =
    ${env:elecrow_s3_n4r8_probe.build_flags}
    -DPG_CONSTRUCTION_PROBE
    -DARDUINO_LOOP_STACK_SIZE=32768

[env:elecrow_s3_storage_probe]
extends = env:elecrow_s3_construction_probe
build_flags =
    ${env:elecrow_s3_construction_probe.build_flags}
    -DPG_STORAGE_PROBE

[env:elecrow_s3_cooking_probe]
extends = env:elecrow_s3_storage_probe
build_flags =
    ${env:elecrow_s3_storage_probe.build_flags}
    -DPG_COOKING_PROBE

[env:elecrow_s3_shelter_probe]
extends = env:elecrow_s3_cooking_probe
build_flags =
    ${env:elecrow_s3_cooking_probe.build_flags}
    -DPG_SHELTER_PROBE

[env:elecrow_s3_settlement_probe]
extends = env:elecrow_s3_shelter_probe
build_flags =
    ${env:elecrow_s3_shelter_probe.build_flags}
    -DPG_SETTLEMENT_PROBE

[env:elecrow_s3_housing_probe]
extends = env:elecrow_s3_settlement_probe
build_flags =
    ${env:elecrow_s3_settlement_probe.build_flags}
    -DPG_HOUSING_PROBE

[env:elecrow_s3_agriculture_probe]
extends = env:elecrow_s3_housing_probe
build_flags =
    ${env:elecrow_s3_housing_probe.build_flags}
    -DPG_AGRICULTURE_PROBE

[env:elecrow_s3_irrigation_probe]
extends = env:elecrow_s3_agriculture_probe
build_flags =
    ${env:elecrow_s3_agriculture_probe.build_flags}
    -DPG_IRRIGATION_PROBE

[env:elecrow_s3_multi_field_probe]
extends = env:elecrow_s3_irrigation_probe
build_flags =
    ${env:elecrow_s3_irrigation_probe.build_flags}
    -DPG_MULTI_FIELD_PROBE

[env:elecrow_s3_crop_loss_probe]
extends = env:elecrow_s3_multi_field_probe
build_flags =
    ${env:elecrow_s3_multi_field_probe.build_flags}
    -DPG_CROP_LOSS_PROBE

[env:elecrow_s3_livestock_probe]
extends = env:elecrow_s3_crop_loss_probe
build_flags =
    ${env:elecrow_s3_crop_loss_probe.build_flags}
    -DPG_LIVESTOCK_PROBE

# Disposable combined-ecosystem CPU/PSRAM probe. Separate source prevents
# different World layouts from being linked into the same executable.
[env:elecrow_s3_integrated_probe]
extends = env:elecrow_s3_n4r8_probe
build_src_filter = -<*> +<integrated.cpp>
build_flags =
    ${env:elecrow_s3_n4r8_probe.build_flags}
    -DPG_INTEGRATED_TARGET_PROBE
    -DARDUINO_LOOP_STACK_SIZE=65536
    -mtext-section-literals
    -fwrapv
    -ffp-contract=off

# Full simulated year, identical integrated rules and isolated source.
[env:elecrow_s3_integrated_annual_probe]
extends = env:elecrow_s3_integrated_probe
build_flags =
    ${env:elecrow_s3_integrated_probe.build_flags}
    -DPG_INTEGRATED_ANNUAL_PROBE

# RGB-only candidate. Match DIS08070H board label before any upload.
[env:elecrow_s3_observer_rgb_probe]
extends = env:elecrow_s3_integrated_probe
build_src_filter = -<*> +<observer.cpp>
lib_deps =
    lovyan03/LovyanGFX@1.1.16
build_flags =
    ${env:elecrow_s3_integrated_probe.build_flags}
    -DPG_OBSERVER_RGB_PROBE

# Separate touch/visibility candidate: no speculative reset/expander writes.
[env:elecrow_s3_observer_touch_probe]
extends = env:elecrow_s3_observer_rgb_probe
build_flags =
    ${env:elecrow_s3_observer_rgb_probe.build_flags}
    -DPG_OBSERVER_TOUCH_PROBE

# Standard DIS08070H only, dedicated SD-only probe, never formats media.
[env:elecrow_s3_sd_probe]
extends = env:elecrow_s3_n4r8_probe
build_src_filter = -<*> +<sd_probe.cpp>
build_flags =
    ${env:elecrow_s3_n4r8_probe.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=32768
