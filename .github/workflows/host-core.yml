name: Host core
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: host-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test portable simulation
        run: bash scripts/test-host.sh
